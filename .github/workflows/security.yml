name: Security scan

# This project scans itself with its own GitHub Action (version: local = the checkout built
# below), so every pull request exercises the exact code path users get.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # sticky summary comment on pull requests

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # merge-base diff against the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: ./
        with:
          path: .
          version: local
          fail-on: high
