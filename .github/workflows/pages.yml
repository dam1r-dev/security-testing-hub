name: Deploy site

# Publishes ./site to GitHub Pages. It does nothing until Pages is switched on, so a fresh clone does not get a
# failing check:
#   1. Repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Repository Settings -> Secrets and variables -> Actions -> Variables: PAGES_ENABLED = true
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
