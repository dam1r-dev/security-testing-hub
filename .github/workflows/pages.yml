name: Deploy site

# Publishes ./site to GitHub Pages. It does nothing until Pages is switched on, so a fresh clone does not get a
# failing check:
#   1. Repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Repository Settings -> Secrets and variables -> Actions -> Variables: PAGES_ENABLED = true
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # the page runs the real scanner in the browser, so a scanner change is a site change
      - "packages/scanner/**"
      - "scripts/build-site-scanner.js"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: "npm"
      # site/scanner/ (worker.js and the WebAssembly files) is built, not committed
      - run: npm ci
      - run: npm run site:scanner
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
