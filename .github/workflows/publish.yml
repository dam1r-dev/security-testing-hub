name: Publish to npm

# Triggered by publishing a GitHub Release (not just any tag push) — creating
# a Release is a deliberate, visible action, which is the right amount of
# friction for something that pushes to a public registry.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC) — no NPM_TOKEN secret at all. npm exchanges
      # this short-lived, workflow-scoped token for publish rights, verified
      # against the trusted publisher configured per-package on npmjs.com.
      # Static automation tokens that bypass 2FA are being phased out by npm
      # (restricted for account changes since Aug 2026, for publishing from
      # Jan 2027) — OIDC is the supported path going forward, not a workaround.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js (npm >=11.5.1 required for trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Ensure a new enough npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # scanner is published first: cli's package.json depends on it by an
      # exact version, so it needs to already exist on the registry before
      # `npm publish` for cli can succeed for a first-time/new version.
      #
      # Trusted publishing can't bootstrap a brand-new package name (npm
      # requires the very first publish of any name to be an authenticated,
      # interactive `npm publish` — see RELEASING.md) — this step only works
      # once a trusted publisher has been configured for security-hub-scanner
      # on npmjs.com, which itself requires the package to already exist.
      - name: Publish security-hub-scanner
        working-directory: packages/scanner
        run: npm publish

      - name: Publish security-hub (CLI)
        working-directory: packages/cli
        run: npm publish
