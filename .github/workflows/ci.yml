name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one broken platform must not hide the results of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # What a new user does: install the packed packages into an empty folder and run them.
      # The native parser (tree-sitter) is the likeliest thing to break on another OS / Node.
      - name: Install smoke test (pack, install into an empty project, scan, web interface)
        run: node scripts/install-smoke.js

      - name: Scan the example vulnerable app (should find issues, non-blocking)
        shell: bash
        run: node packages/cli/bin/security-hub.js scan examples/vulnerable-express-app --format text || true

  sql-injection-lab-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run the SQL injection lab end-to-end (exploit + verified fix)
        run: node labs/sql-injection/e2e.js
