name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # --- TEMPORARY DIAGNOSTICS for a CI-only tree-sitter native binding
      # issue (passes on every local OS tested, fails deterministically here).
      # Remove this block once root-caused.
      - name: DEBUG native module info
        continue-on-error: true
        run: |
          node -e "console.log(process.versions)"
          find . -name "*.node" -not -path "*/node_modules/.bin/*" -exec ls -la {} \; 2>&1 || true
          node scripts/debug-parse.js
      - name: DEBUG jest --maxWorkers=20 (one process per test file)
        continue-on-error: true
        run: cd packages/scanner && npx jest --maxWorkers=20
      # --- end temporary diagnostics ---

      - name: Test
        run: npm test

      - name: Scan the example vulnerable app (should find issues, non-blocking)
        run: node packages/cli/bin/security-hub.js scan examples/vulnerable-express-app --format text || true

  sql-injection-lab-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run the SQL injection lab end-to-end (exploit + verified fix)
        run: node labs/sql-injection/e2e.js
