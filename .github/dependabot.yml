# Keeps dependencies and workflow actions current. Updates arrive as pull requests that run the normal CI, so a bad
# update is visible before it is merged.
#
# npm: only minor and patch updates, in one grouped pull request. A MAJOR bump of the parser (tree-sitter), of chalk
# (ESM only), of typescript or of js-yaml changes the build or the native binary: those are done by hand, on purpose,
# and a security fix for any of them still arrives as a Dependabot security update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The parser family is pinned as a SET: the native binding, its grammars and the WebAssembly runtime must agree on one grammar ABI,
      # and for 0.x packages a "minor" bump (0.21 -> 0.25) is a breaking one. Moved by hand, together, with the parity tests.
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"
      - dependency-name: "web-tree-sitter"
      # the VS Code extension must compile against the oldest editor it supports (engines.vscode), not the newest
      - dependency-name: "@types/vscode"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
