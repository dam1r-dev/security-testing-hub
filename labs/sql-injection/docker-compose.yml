services:
  app:
    build: ./app
    ports:
      # 127.0.0.1 only: this app is vulnerable on purpose and must not be reachable from the network ("3300:3000" would
      # publish it on every interface, including the Wi-Fi of whatever café you are in)
      - "127.0.0.1:3300:3000"
    environment:
      - SAFE_MODE=${SAFE_MODE:-0}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
